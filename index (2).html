<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campusly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff;--ink:#15171c;--mute:#6b7080;--line:#e7e8ec;--acc:#3347ff;--accbg:#eef0ff;--ok:#12805c;--okbg:#e6f6f0;--warn:#a85f00;--warnbg:#fff3df;--err:#c4322f;--errbg:#fdeceb;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--ink:#eef0f4;--mute:#9298a8;--line:#262a33;--acc:#8793ff;--accbg:#1b2040;--ok:#4cd6a0;--okbg:#10291f;--warn:#f0b04d;--warnbg:#2c2210;--err:#ff7b78;--errbg:#2d1514;--card:#151820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--ink:#eef0f4;--mute:#9298a8;--line:#262a33;--acc:#8793ff;--accbg:#1b2040;--ok:#4cd6a0;--okbg:#10291f;--warn:#f0b04d;--warnbg:#2c2210;--err:#ff7b78;--errbg:#2d1514;--card:#151820;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;gap:12px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--acc)}
.seg{display:flex;background:var(--accbg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:500;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{border:0;background:none;padding:10px 0;cursor:pointer;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button.on{color:var(--ink);border-color:var(--acc)}
h1{font-size:26px;letter-spacing:-.03em;margin:4px 0 14px;line-height:1.15}
h2{font-size:17px;margin:22px 0 10px;letter-spacing:-.01em}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.chip{flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:5px 13px;cursor:pointer;font-size:14px;color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.date{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 0;height:58px}
.date b{display:block;font-size:20px;line-height:1.1;letter-spacing:-.02em}
.date span{font-size:12px;color:var(--mute)}
.ev h3{margin:0;font-size:16px;letter-spacing:-.01em}
.meta{color:var(--mute);font-size:13.5px;margin:2px 0 8px}
.ev p{margin:0 0 10px;font-size:14px}
.btn{border:0;background:var(--acc);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn.ghost{background:var(--accbg);color:var(--acc)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.tag{font-size:13px;color:var(--mute)}
.ticket{border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:18px;overflow:hidden}
.ticket .top{padding:18px 18px 16px}
.ticket .top h3{margin:0 0 2px;font-size:19px;letter-spacing:-.02em}
.ticket .bot{position:relative;border-top:2px dashed var(--line);padding:18px;text-align:center}
.ticket .bot:before,.ticket .bot:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .bot:before{left:-11px;clip-path:inset(0 0 0 50%)}
.ticket .bot:after{right:-11px;clip-path:inset(0 50% 0 0)}
.qr{display:inline-block;padding:10px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.qr img,.qr canvas{display:block}
.code{font:600 15px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;margin-top:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.acc{background:var(--accbg);color:var(--acc)}
.stats{display:flex;gap:26px;margin:14px 0 8px}
.stats b{font-size:30px;letter-spacing:-.03em;display:block;line-height:1.1}
.stats span{font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--accbg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
#reader{width:100%;max-width:340px;margin:12px auto 0;border-radius:14px;overflow:hidden}
.row{display:flex;gap:8px;margin-top:12px}
.res{margin-top:12px;padding:14px;border-radius:12px;font-size:14px}
.res b{display:block;font-size:17px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.warn{background:var(--warnbg);color:var(--warn)}.res.err{background:var(--errbg);color:var(--err)}
.g{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.g small{display:block;color:var(--mute);font-size:13px}
label{display:block;font-size:13.5px;color:var(--mute);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{padding:36px 0;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash .mark{font-weight:700;font-size:46px;letter-spacing:-.04em;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
#splash .mark i{font-style:normal;color:var(--acc)}
#splash .sub{color:var(--mute);margin-top:6px;animation:pop .9s .25s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash .mark,#splash .sub{animation:none}}
.auth{max-width:380px;margin:26px auto 0}
.auth h1{margin-bottom:4px}
.idbox{font:600 24px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:18px;border:1px dashed var(--acc);border-radius:14px;text-align:center;background:var(--accbg);color:var(--acc);margin-bottom:12px}
nav{overflow-x:auto}nav button{flex:none}
@media print{.wrap,#splash,#toast{display:none!important}}
.mg{border-bottom:1px solid var(--line);padding:12px 0}.mg summary{cursor:pointer;font-weight:600}.mg small{color:var(--mute);font-weight:400}
.note{font-size:13px;color:var(--mute);background:var(--accbg);border-radius:10px;padding:10px 12px;margin-top:14px}
.err{color:var(--err);font-size:13.5px;margin:10px 0;min-height:20px}
.link{border:0;background:none;color:var(--acc);cursor:pointer;padding:0;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">Campus<i>ly</i></div>
<div id="who" class="row" style="margin:0;align-items:center"></div></header>
<main id="app"></main>
</div>
<dialog id="tdlg"><form method="dialog" id="tf"><div id="tfb"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn line" id="tc">Cancel</button><button class="btn">Continue</button></div></form></dialog>
<dialog id="cdlg"></dialog>
<div id="splash"><div class="mark">Campus<i>ly</i></div><div class="sub">Every campus event, one ticket</div></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const K='campusly-v6';
const DEMOH='29d1281934b777f0aa3256eba7886479dfab1d2637927b73f6657344a0ea59b0';
const seed=()=>({users:[{id:'IITP-STU-DEMO1',email:'demo@student.test',name:'Demo Student',roll:'DEMO001',college:'IITP',ph:DEMOH}],clubs:[{id:'IITP-STC',club:'Student Technical Council',college:'IITP',email:'demo@club.test',ph:DEMOH,approved:true}],coords:[{id:'IITP-COORD',college:'IITP',name:'Demo Coordinator',email:'demo@coord.test',ph:DEMOH}],colleges:[{name:'IIT Patna',code:'IITP',lat:25.535,lng:84.852},{name:'NIT Patna',code:'NITP',lat:25.621,lng:85.171},{name:'BIT Mesra',code:'BITM',lat:23.412,lng:85.440}],session:null,regs:[],events:[
{id:'e1',title:'Xenith Tech Fest',club:'Student Technical Council',date:'2026-12-12',time:'10:00 AM',venue:'Main Auditorium',cap:300,desc:'Talks, hackathon finals and a startup expo. Open to every programme.'},
{id:'e2',title:'Open Mic Night',club:'Cultural Club',date:'2026-11-07',time:'6:30 PM',venue:'Amphitheatre',cap:120,desc:'Poetry, music, stand-up. Sign up to perform at the door.'},
{id:'e3',title:'Startup Pitch Day',club:'E-Cell',date:'2026-11-14',time:'2:00 PM',venue:'Seminar Hall 2',cap:80,desc:'Five student teams pitch to alumni founders. Feedback round after.'},
{id:'e4',title:'Sunrise Photo Walk',club:'Photo Club',date:'2026-11-02',time:'6:45 AM',venue:'Campus Gate 1',cap:40,desc:'Bring any camera. We walk the campus at first light.'},
{id:'e5',title:'Git and GitHub for Beginners',club:'Coding Club',date:'2026-10-28',time:'5:00 PM',venue:'Lab 3',cap:60,desc:'Hands-on session. Bring a laptop with Git installed.'}]});
const seed2=()=>{const s=seed();s.events.forEach(e=>{e.college='IITP';e.city='Patna';e.open=e.id==='e1'||e.id==='e3'});
s.events.push(
{id:'e6',title:'Inter-College Quiz League',club:'Quiz Club',clubId:'NITP-QZC',college:'NITP',city:'Patna',open:true,date:'2026-11-09',time:'11:00 AM',venue:'Main Seminar Hall',cap:150,desc:'Teams of three from any college. Prizes for the top four.'},
{id:'e7',title:'Alumni Meetup',club:'Alumni Cell',clubId:'NITP-ALC',college:'NITP',city:'Patna',open:false,date:'2026-11-16',time:'4:00 PM',venue:'Admin Lawn',cap:90,desc:'NIT Patna students only.'},
{id:'e8',title:'Robotics Showcase',club:'Robotics Club',clubId:'BITM-ROB',college:'BITM',city:'Ranchi',open:true,date:'2026-11-21',time:'10:30 AM',venue:'Workshop Block',cap:100,desc:'Live bot demos and a line-follower contest, open to every college.'});const CAT={e1:'Tech',e2:'Cultural',e4:'Cultural',e5:'Workshop',e8:'Tech'};s.events.forEach(e=>{e.category=CAT[e.id]||'Other';e.team=e.id==='e6'?3:1});return s};
const colName=c=>(S.colleges.find(x=>x.code===c)||{}).name||c;
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.events)S=seed2();
S.colleges=S.colleges||[];S.saves=S.saves||{};S.coords=S.coords||[];S.vols=S.vols||[];S.notices=S.notices||[];S.reports=S.reports||[];S.follows=S.follows||{};S.rolls=S.rolls||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const ui={role:'student',tab:'events',club:'All',city:'All',cat:'All',loc:null,q:'',aev:null,mode:'in',pend:null,done:null,aTab:'student'};
const CID={'Student Technical Council':'IITP-STC','Cultural Club':'IITP-CUL','E-Cell':'IITP-ECL','Photo Club':'IITP-PHO','Coding Club':'IITP-COD'};
const cid=e=>e.clubId||CID[e.club]||'CMP-EVT';
const fols=()=>S.follows[S.session.id]||[];
const saved=()=>S.saves[S.session.id]||[];
const isSaved=id=>saved().includes(id);
const toggleSave=id=>{const a=saved();S.saves[S.session.id]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save()};
const dist=(a,b)=>{const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const kmTo=e=>{const c=S.colleges.find(x=>x.code===e.college);return ui.loc&&c&&c.lat!=null?dist(ui.loc,c):null};
const waitN=id=>S.regs.filter(r=>r.eventId===id&&r.wait).length;
const mine=()=>S.regs.filter(r=>r.owner===S.session.id);
const cEvents=()=>S.events.filter(e=>cid(e)===S.session.id);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ev=id=>S.events.find(x=>x.id===id);
const taken=id=>S.regs.filter(r=>r.eventId===id&&!r.wait&&!r.pending).length;
const dparts=d=>{const t=new Date(d+'T00:00');return{d:t.getDate(),m:t.toLocaleString('en-IN',{month:'short'})}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)};
const hhmm=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});

const TABS={student:[['events','My college'],['other','Other colleges'],['saved','Saved'],['clubs','Clubs'],['tickets','My tickets'],['me','Profile']],admin:[['checkin','Check-in'],['manage','Manage'],['create','New event']],vol:[['checkin','Check-in']],coord:[['review','Review']]};
function render(){
  stopScan();
  const se=S.session;
  $('#who').innerHTML=se?`<span class="tag">${esc(se.role==='admin'?se.club+(se.vol?' (volunteer)':''):se.name)}</span><button class="btn line" id="out">Log out</button>`:'';
  if(!se){$('#app').innerHTML=viewAuth();bindAuth();return}
  $('#out').onclick=()=>{S.session=null;ui.pend=null;save();render()};
  ui.role=se.role;
  const tabs=TABS[se.vol?'vol':se.role];
  if(!tabs.some(t=>t[0]===ui.tab))ui.tab=tabs[0][0];
  const P={events:[viewEvents,bindEvents],other:[viewEvents,bindEvents],saved:[viewEvents,bindEvents],clubs:[viewClubs,bindClubs],tickets:[viewTickets,bindTickets],me:[viewMe,bindMe],checkin:[viewCheckin,bindCheckin],manage:[viewManage,bindManage],create:[viewCreate,bindCreate],review:[viewReview,bindReview]}[ui.tab];
  $('#app').innerHTML='<nav>'+tabs.map(t=>`<button class="${ui.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}${t[0]==='tickets'&&mine().length?' ('+mine().length+')':''}</button>`).join('')+'</nav>'+P[0]();
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render()});
  P[1]();
}

/* Student: events */
const CATS=['Tech','Cultural','Sports','Workshop','Other'];
const scoped=()=>S.events.filter(e=>!e.removed).filter(e=>ui.tab==='saved'?isSaved(e.id)&&(e.college===S.session.college||e.open):ui.tab==='other'?(e.college!==S.session.college&&e.open):e.college===S.session.college);
const days=d=>Math.round((new Date(d+'T00:00')-new Date(new Date().toDateString()))/864e5);
function remHTML(){
  const ids=new Set([...saved(),...mine().filter(r=>!r.wait&&!r.pending).map(r=>r.eventId)]);
  const up=[...ids].map(ev).filter(e=>e&&!e.cancelled&&!e.removed&&days(e.date)>=0&&days(e.date)<=14).sort((a,b)=>a.date.localeCompare(b.date));
  const nt=S.notices.filter(n=>ids.has(n.eventId)).sort((a,b)=>b.at-a.at).slice(0,3);
  const cats=new Set([...ids].map(i=>(ev(i)||{}).category||'Other'));
  const rec=ids.size?S.events.filter(e=>e.college===S.session.college&&!e.cancelled&&!e.removed&&!ids.has(e.id)&&cats.has(e.category||'Other')&&days(e.date)>=0).slice(0,2):[];
  const box=(h,l)=>`<div class="note" style="margin:0 0 12px"><b>${h}</b><br>${l.join('<br>')}</div>`;
  return (nt.length?box('Updates',nt.map(n=>esc(ev(n.eventId).title)+': '+esc(n.text))):'')+(up.length?box('Coming up',up.map(e=>esc(e.title)+' '+(days(e.date)===0?'is today':days(e.date)===1?'is tomorrow':'is in '+days(e.date)+' days'))):'')+(rec.length?box('You may like',rec.map(e=>esc(e.title))):'');
}
function viewEvents(){
  const t=ui.tab,o=t==='other',keys=['All',...new Set(scoped().map(e=>o?e.city:e.club).filter(Boolean))],cur=o?ui.city:ui.club;
  const head=t==='saved'?'Saved events':o?'Open to all colleges':'Events at '+esc(colName(S.session.college));
  return `<h1>${head}</h1>${t==='events'?remHTML():''}
  <input class="in" id="q" type="search" placeholder="${o?'Search events, clubs or colleges':'Search events or clubs'}" value="${esc(ui.q)}" aria-label="Search events">
  <div class="chips">${keys.map(c=>`<button class="chip ${cur===c?'on':''}" data-club="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="chips" style="padding-top:0">${['All',...CATS].map(c=>`<button class="chip ${ui.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
  ${o?`<div class="row" style="margin:4px 0 0"><button class="btn line" id="near">${ui.loc?'Sorted by distance':'Sort by distance from me'}</button></div>`:''}
  <div id="list">${listHTML()}</div>`;
}
function listHTML(){
  const q=ui.q.toLowerCase(),o=ui.tab==='other',me=S.session.college;
  let l=scoped().filter(e=>(o?ui.city==='All'||e.city===ui.city:ui.club==='All'||e.club===ui.club)&&(ui.cat==='All'||(e.category||'Other')===ui.cat)&&(e.title+e.club+colName(e.college)).toLowerCase().includes(q));
  l=l.sort(o&&ui.loc?(a,b)=>(kmTo(a)??1e9)-(kmTo(b)??1e9):(a,b)=>(fols().includes(cid(b))-fols().includes(cid(a)))||a.date.localeCompare(b.date));
  if(!l.length)return '<div class="empty">'+(ui.tab==='saved'?'Nothing saved yet. Tap Save on any event.':'No events match. Try a different filter or search.')+'</div>';
  return l.map(e=>{
    const p=dparts(e.date),left=e.cap-taken(e.id),r=mine().find(x=>x.eventId===e.id),km=kmTo(e),tm=e.team||1,gone=S.regs.filter(x=>x.eventId===e.id&&!x.wait&&!x.pending&&x.owner.split('-')[0]===me).length;
    const act=e.cancelled?'<button class="btn" disabled>Cancelled</button>':r?`<button class="btn ghost" data-view="${e.id}">${r.pending?'Awaiting approval':r.wait?'On waitlist':'View ticket'}</button>`:left<=0?`<button class="btn" data-reg="${e.id}">Join waitlist</button>`:`<button class="btn" data-reg="${e.id}">${e.approval?'Request to join':tm>1?'Register team':'Register'}</button>`;
    const extra=[e.cohosts?'With '+esc(e.cohosts):'',e.sponsors?'Sponsors: '+esc(e.sponsors):'',gone?gone+' from your college going':''].filter(Boolean).join('<br>');
    return `<article class="ev"><div class="date"><b>${p.d}</b><span>${p.m}</span></div><div style="flex:1;min-width:0">
    ${e.college!==me?'<div style="margin-bottom:4px"><span class="pill acc">'+esc(colName(e.college))+(e.city?', '+esc(e.city):'')+(km!=null?', '+Math.round(km)+' km away':'')+'</span></div>':''}<h3>${esc(e.title)}</h3><div class="meta">${esc(e.club)}, ${esc(e.time)}, ${esc(e.venue)}</div>
    <p>${esc(e.desc)}</p><div class="tag" style="margin-bottom:8px">${esc(e.category||'Other')}${tm>1?', teams of up to '+tm:''}${extra?'<br>'+extra:''}</div>
    <div class="row" style="margin:0;align-items:center">${act}<button class="btn line" data-save="${e.id}">${isSaved(e.id)?'Saved':'Save'}</button><span class="tag">${e.cancelled?'':left>0?left+(tm>1?' team':'')+' spots left':'Full, '+waitN(e.id)+' waiting'}</span></div>
    <div style="margin-top:8px"><button class="link" data-share="${e.id}">Share</button> <button class="link" data-rep="${e.id}" style="color:var(--mute);font-weight:500">Report</button></div></div></article>`}).join('');
}
function bindListBtns(){
  document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>register(b.dataset.reg));
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ui.tab='tickets';render()});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{toggleSave(b.dataset.save);$('#list').innerHTML=listHTML();bindListBtns()});

const hash=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))),b=>b.toString(16).padStart(2,'0')).join('');
const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
const field=(id,label,attrs)=>`<label for="${id}">${label}</label><input class="in" id="${id}" ${attrs||''}>`;
const BTN='<button class="btn" style="width:100%">';
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function collegeCode(name){
  const n=norm(name);if(!n)return '';
  const hit=S.colleges.find(c=>norm(c.name)===n);if(hit)return hit.code;
  const stop=['of','the','and','for','in'];
  let c=name.replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!stop.includes(w.toLowerCase())).map(w=>/^[A-Z]{2,4}$/.test(w)?w:w[0].toUpperCase()).join('').slice(0,8);
  if(c.length<2)c=n.replace(/ /g,'').slice(0,4).toUpperCase();
  let u=c,i=2;while(S.colleges.some(x=>x.code===u))u=c+i++;
  return u;
}

    if(r==='student'){
      let id;do{id=p.college+'-STU-'+rnd(5)}while(S.users.some(u=>u.id===id));
      S.users.push({id,email:p.email,name:p.name,roll:p.roll,college:p.college,ph});ui.done=id;
    }else if(r==='admin'){
      const approved=!S.coords.some(c=>c.college===p.college);
      S.clubs.push({id:p.id,club:p.club,college:p.college,email:p.email,ph,approved});ui.done=p.id;ui.wait=!approved;
    }else{S.coords.push({id:p.id,college:p.college,name:p.name,email:p.email,ph});ui.done=p.id}
    ui.pend=null;save();render()};
  if($('#lf'))$('#lf').onsubmit=async e=>{e.preventDefault();
    const id=val('li').toUpperCase(),ph=await hash($('#lp').value),r=ui.aTab;
    if(r==='student'){
      const u=S.users.find(x=>x.id===id);
      if(!u||u.ph!==ph)return er('ID or password is incorrect.');
      start({role:'student',id:u.id,name:u.name,roll:u.roll,college:u.college});
    }else if(r==='admin'){
      const c=S.clubs.find(x=>x.id===id),v=S.vols.find(x=>x.id===id),a=c||(v&&S.clubs.find(x=>x.id===v.clubId));
      if(!a||(c||v).ph!==ph)return er('ID or password is incorrect.');

      start({role:'admin',id:a.id,club:a.club,college:a.college,vol:!c});
    }else{
      const c=S.coords.find(x=>x.id===id);
      if(!c||c.ph!==ph)return er('ID or password is incorrect.');
      start({role:'coord',id:c.id,name:c.name,college:c.college});
    }};
}

    $('#reqs').innerHTML=pd.length?pd.map(r=>`<div class="g"><div>${esc(r.name)}<small>${esc(r.roll)}${(r.answers||[]).length?', '+r.answers.map(a=>esc(a.q)+': '+esc(a.a)).join('; '):''}</small></div><div class="row" style="margin:0"><button class="btn" data-ap="${r.code}">Approve</button><button class="btn line" data-rj="${r.code}">Reject</button></div></div>`).join(''):'<div class="empty">No pending requests.</div>';
    document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const r=S.regs.find(x=>x.code===b.dataset.ap),full=taken(ui.aev)>=e.cap;r.pending=false;if(full)r.wait=true;save();dyn()});
    document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{S.regs=S.regs.filter(x=>x.code!==b.dataset.rj);save();dyn()});
  }
  $('#guests').innerHTML=regs.length?regs.map(r=>`<div class="g"><div>${esc(r.name)}<small>${esc(r.roll)}, ${r.code}</small></div>
  ${r.used?`<span class="pill ok">In at ${hhmm(r.used)}</span>`:`<button class="btn line" data-in="${r.code}">Mark in</button>`}</div>`).join(''):'<div class="empty">No registrations for this event yet.</div>';
  document.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>showRes(checkIn(b.dataset.in)));
}
function checkIn(raw){
  const code=String(raw).trim().toUpperCase(),r=S.regs.find(x=>x.code===code);
  if(!r)return{t:'err',m:'Ticket not found',s:'This code isn’t registered for any event.'};
  if(r.wait||r.pending)return{t:'err',m:'Not confirmed',s:'This registration has no confirmed spot.'};
  if(r.eventId!==ui.aev)return{t:'err',m:'Wrong event',s:'This ticket is for '+ev(r.eventId).title+'.'};
  if(ev(r.eventId).cancelled)return{t:'err',m:'Event cancelled',s:'This event has been cancelled.'};
  if(r.used)return{t:'warn',m:'Already checked in',s:r.name+' entered at '+hhmm(r.used)+'.'};
  r.used=Date.now();save();
  return{t:'ok',m:'Entry allowed',s:r.team?'Team '+r.team.name+', '+(1+r.team.members.length)+' people':r.name+', '+r.roll};
}
function showRes(x){$('#res').innerHTML=`<div class="res ${x.t}"><b>${esc(x.m)}</b>${esc(x.s)}</div>`;dyn();if(navigator.vibrate)try{navigator.vibrate(x.t==='ok'?80:[60,40,60])}catch(e){}}
async function stopScan(){if(scanner){const s=scanner;scanner=null;try{await s.stop();s.clear()}catch(e){}}}
async function toggleScan(){
  const b=$('#scanbtn');
  if(scanner){await stopScan();b.textContent='Start camera';return}
  try{
    const s=new Html5Qrcode('reader');scanner=s;
    await s.start({facingMode:'environment'},{fps:10,qrbox:{width:210,height:210}},t=>{
      if(t===lastScan&&Date.now()-lastT<2500)return;lastScan=t;lastT=Date.now();showRes(checkIn(t))},()=>{});
    b.textContent='Stop camera';
  }catch(e){scanner=null;toast('Camera unavailable. Type the ticket code instead.')}
}
function bindCheckin(){
  if(!$('#aev'))return;
  $('#aev').onchange=e=>{ui.aev=e.target.value;render()};
  $('#scanbtn').onclick=toggleScan;
  const go=()=>{const v=$('#manual').value;if(!v.trim())return;showRes(checkIn(v));$('#manual').value=''};
  $('#mbtn').onclick=go;$('#manual').onkeydown=e=>{if(e.key==='Enter')go()};
  if($('#exp'))$('#exp').onclick=()=>{
    const rows=[['Name','Roll','College','Code','Team','Answers','Checked in']].concat(S.regs.filter(r=>r.eventId===ui.aev&&!r.wait&&!r.pending).map(r=>[r.name,r.roll,r.owner.split('-')[0],r.code,r.team?r.team.name+' ('+r.team.members.join('; ')+')':'',(r.answers||[]).map(a=>a.a).join('; '),r.used?hhmm(r.used):'']));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    $('#cdlg').innerHTML='<h2 style="margin-top:0">Guest list (CSV)</h2><p class="tag">Copy this into Excel or Google Sheets.</p><textarea class="in" rows="8" readonly>'+esc(csv)+'</textarea><div class="row" style="justify-content:flex-end"><button class="btn line" id="cx">Close</button><button class="btn" id="cc2">Copy</button></div>';
    $('#cdlg').showModal();$('#cx').onclick=()=>$('#cdlg').close();
    $('#cc2').onclick=()=>{try{navigator.clipboard.writeText(csv);toast('Copied.')}catch(x){toast('Select the text and copy it.')}};
  };
  dyn();
}

/* Admin: manage events and volunteers */
function viewManage(){
  const ce=cEvents(),vs=S.vols.filter(v=>v.clubId===S.session.id);
  return '<h1>Manage events</h1>'+(ce.map(e=>`<details class="mg"><summary>${esc(e.title)}${e.cancelled?' (cancelled)':''} <small>${e.date}, ${esc(e.time)}</small></summary>
  <div class="two">${field('md'+e.id,'Date','type="date" value="'+e.date+'"')}${field('mt'+e.id,'Time','value="'+esc(e.time)+'"')}</div>
  <div class="two">${field('mv'+e.id,'Venue','value="'+esc(e.venue)+'"')}${field('mc'+e.id,'Capacity','type="number" min="1" value="'+e.cap+'"')}</div>
  ${field('ma'+e.id,'Message to registered students (optional)','placeholder="e.g. Venue moved to Hall 2"')}
  <div class="row"><button class="btn" data-sv="${e.id}">Save and notify</button><button class="btn line" data-an="${e.id}">Send message only</button><button class="btn line" data-cx="${e.id}">${e.cancelled?'Reopen event':'Cancel event'}</button></div></details>`).join('')||'<div class="empty">No events yet.</div>')
  +`<h2>Volunteers</h2><p class="tag" style="margin:0 0 8px">Volunteers can scan tickets but can’t edit anything.</p>${ui.newVol?`<div class="note" style="margin:0 0 10px">New volunteer ID: <b>${esc(ui.newVol)}</b></div>`:''}
  ${vs.map(v=>`<div class="g"><div>${esc(v.id)}</div><button class="btn line" data-rv="${v.id}">Remove</button></div>`).join('')}
  <div class="row" style="align-items:flex-end"><div style="flex:1">${field('vp','Set a password for the volunteer','type="password" minlength="6"')}</div><button class="btn ghost" id="av">Add volunteer</button></div>`;
}
function bindManage(){
  const g=id=>$('#'+id).value.trim();
  document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const e=ev(b.dataset.sv),id=e.id,ch=[];
    if(g('md'+id)&&g('md'+id)!==e.date){e.date=g('md'+id);ch.push('the date is now '+e.date)}
    if(g('mt'+id)&&g('mt'+id)!==e.time){e.time=g('mt'+id);ch.push('the time is now '+e.time)}
    if(g('mv'+id)&&g('mv'+id)!==e.venue){e.venue=g('mv'+id);ch.push('the venue is now '+e.venue)}
    e.cap=+g('mc'+id)||e.cap;
    if(ch.length||g('ma'+id))S.notices.push({eventId:id,text:(ch.length?'Updated, '+ch.join(', ')+'. ':'')+g('ma'+id),at:Date.now()});
    save();toast('Saved. Registered students will see the update.');render()});
  document.querySelectorAll('[data-an]').forEach(b=>b.onclick=()=>{const id=b.dataset.an,m=g('ma'+id);if(!m)return toast('Write a message first.');S.notices.push({eventId:id,text:m,at:Date.now()});save();toast('Message sent to registered students.');render()});
  document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{const e=ev(b.dataset.cx);e.cancelled=!e.cancelled;S.notices.push({eventId:e.id,text:e.cancelled?'This event has been cancelled.':'This event is back on.',at:Date.now()});save();render()});
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{S.vols=S.vols.filter(v=>v.id!==b.dataset.rv);save();render()});
  $('#av').onclick=async()=>{const pw=$('#vp').value;if(pw.length<6)return toast('Use at least 6 characters.');let id;do{id=S.session.id+'-V'+rnd(3)}while(S.vols.some(v=>v.id===id));S.vols.push({id,clubId:S.session.id,ph:await hash(pw)});ui.newVol=id;save();render()};
}

/* Admin: create event */
function viewCreate(){
  return `<h1>Create an event</h1><form id="cf">
  <label for="t" style="margin-top:0">Event name</label><input class="in" id="t" required>
  <label for="c">Club</label><input class="in" id="c" value="${esc(S.session.club)}" readonly>
  <div class="two"><div><label for="d">Date</label><input class="in" id="d" type="date" required></div><div><label for="tm">Time</label><input class="in" id="tm" type="time" required></div></div>
  <div class="two"><div><label for="v">Venue</label><input class="in" id="v" required></div><div><label for="cp">Capacity</label><input class="in" id="cp" type="number" min="1" value="100" required></div></div>
  <div class="two"><div><label for="ct">City</label><input class="in" id="ct" required value="${esc((S.colleges.find(c=>c.code===S.session.college)||{}).city||'')}"></div><div><label for="op">Who can join</label><select class="in" id="op"><option value="0">Only ${esc(colName(S.session.college))}</option><option value="1">All colleges</option></select></div></div>
  <div class="two"><div><label for="cg">Category</label><select class="in" id="cg">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="tz">Team size (1 = solo)</label><input class="in" id="tz" type="number" min="1" max="10" value="1"></div></div>
  <label for="qs">Questions at registration (comma separated, optional)</label><input class="in" id="qs" placeholder="T-shirt size, Food preference">
  <div class="two"><div><label for="ch">Co-hosting clubs (optional)</label><input class="in" id="ch"></div><div><label for="sp">Sponsors (optional)</label><input class="in" id="sp"></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="ap"> Approve each registration manually</label>
  <div class="row" style="align-items:center"><button type="button" class="btn line" id="loc">Set my college location</button><span class="tag" id="locs">${(S.colleges.find(c=>c.code===S.session.college)||{}).lat!=null?'Location set.':'Not set. Students use it to sort by distance.'}</span></div>
  <label for="ds">Description</label><textarea class="in" id="ds" rows="3"></textarea>
  <div class="row"><button class="btn">Publish event</button></div></form>`;
}
function bindCreate(){
  $('#loc').onclick=()=>{if(!navigator.geolocation)return toast('Location isn’t available on this device.');navigator.geolocation.getCurrentPosition(p=>{const c=S.colleges.find(x=>x.code===S.session.college);if(c){c.lat=p.coords.latitude;c.lng=p.coords.longitude;save()}$('#locs').textContent='Location saved.'},()=>toast('Location is blocked. Allow it in your browser, then try again.'),{timeout:8000})};
  $('#cf').onsubmit=e=>{e.preventDefault();
    const [hh,mm]=$('#tm').value.split(':').map(Number);
    const time=((hh%12)||12)+':'+String(mm).padStart(2,'0')+(hh<12?' AM':' PM');
    const n={id:'e'+Date.now(),title:$('#t').value.trim(),club:S.session.club,clubId:S.session.id,college:S.session.college,city:$('#ct').value.trim(),open:$('#op').value==='1',category:$('#cg').value,team:+$('#tz').value||1,questions:$('#qs').value.split(',').map(s=>s.trim()).filter(Boolean),cohosts:$('#ch').value.trim(),sponsors:$('#sp').value.trim(),approval:$('#ap').checked,date:$('#d').value,time,venue:$('#v').value.trim(),cap:+$('#cp').value,desc:$('#ds').value.trim()};
    S.events.push(n);{const cl=S.colleges.find(c=>c.code===n.college);if(cl)cl.city=n.city}ui.aev=n.id;save();toast('Event published.');ui.tab='checkin';render()};
}

/* Coordinator */
function viewReview(){
  const col=S.session.college,pc=S.clubs.filter(c=>c.college===col&&!c.approved),ac=S.clubs.filter(c=>c.college===col&&c.approved);
  const rp=[...new Set(S.reports.map(r=>r.eventId))].map(ev).filter(e=>e&&!e.removed&&e.college===col);
  return `<h1>${esc(colName(col))}</h1><h2>Clubs waiting for approval</h2>${pc.map(c=>`<div class="g"><div>${esc(c.club)}<small>${c.id}, ${esc(c.email)}</small></div><div class="row" style="margin:0"><button class="btn" data-ok="${c.id}">Approve</button><button class="btn line" data-no="${c.id}">Reject</button></div></div>`).join('')||'<div class="empty">No pending clubs.</div>'}
  <h2>Approved clubs</h2>${ac.map(c=>`<div class="g"><div>${esc(c.club)}<small>${c.id}</small></div></div>`).join('')||'<div class="empty">None yet.</div>'}
  <h2>Reported events</h2>${rp.map(e=>`<div class="g"><div>${esc(e.title)}<small>${esc(e.club)}, ${S.reports.filter(r=>r.eventId===e.id).length} report(s)</small></div><div class="row" style="margin:0"><button class="btn" data-rm="${e.id}">Remove</button><button class="btn line" data-dm="${e.id}">Dismiss</button></div></div>`).join('')||'<div class="empty">No reports.</div>'}
  <h2>Verified roll numbers</h2><p class="tag" style="margin:0 0 8px">Once you save a list, only students whose roll number is on it can sign up for ${esc(colName(col))}.</p>
  <textarea class="in" id="rolls" rows="5" placeholder="One roll number per line">${esc((S.rolls[col]||[]).join('\n'))}</textarea><div class="row"><button class="btn" id="sr2">Save list</button></div>`;
}
function bindReview(){
  const col=S.session.college;
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{S.clubs.find(c=>c.id===b.dataset.ok).approved=true;save();render()});
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{S.clubs=S.clubs.filter(c=>c.id!==b.dataset.no);save();render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ev(b.dataset.rm).removed=true;S.reports=S.reports.filter(r=>r.eventId!==b.dataset.rm);save();render()});
  document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{S.reports=S.reports.filter(r=>r.eventId!==b.dataset.dm);save();render()});
  $('#sr2').onclick=()=>{S.rolls[col]=$('#rolls').value.split('\n').map(s=>s.trim().toUpperCase()).filter(Boolean);save();toast('Saved '+S.rolls[col].length+' roll numbers.')};
}

render();
setTimeout(()=>$('#splash').classList.add('hide'),1900);
</script>
